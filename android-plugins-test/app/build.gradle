plugins {
    id "com.android.application"
}

def levixelArtifact = file("../.artifacts/levixel.aar")
if (!levixelArtifact.exists()) {
    throw new GradleException(
            "Levixel AAR not found. Run plugins/levixel/scripts/verify-native-android.sh first."
    )
}

base {
    archivesName = "android-plugins-test"
}

android {
    namespace = "com.sandrox.integratedplugins.androidtest"
    compileSdk = 36

    defaultConfig {
        applicationId = "com.sandrox.integratedplugins.androidtest"
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles(
                    getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.activity:activity:1.11.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-ui:1.5.1"
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "com.github.chrisbanes:PhotoView:2.3.0"
    implementation files(levixelArtifact)
}
